services:
  - type: web
    name: school-mis-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://school-mis-backend.onrender.com
      - key: VITE_APP_NAME
        value: SchoolMIS
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
